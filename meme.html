<style>

    --glass-strong: rgba(14,14,24,0.72);
    --border: rgba(255,255,255,0.09);
    --border-hover: rgba(207,10,44,0.55);
    --text: #ececf4;
    --text-dim: #8a8aa4;
    --text-faint: rgba(255,255,255,0.06);
    --shadow: 0 6px 28px rgba(0,0,0,0.4);
    --rim: rgba(255,255,255,0.12);
  }
  [data-theme="light"] {
    --bg: #e8ecf2;
    --bg-grad-1: rgba(207,10,44,0.07);
    --bg-grad-2: rgba(90,80,200,0.05);
    --bg-grad-3: rgba(251,114,153,0.05);
    --glass: rgba(255,255,255,0.5);
    --glass-hover: rgba(255,255,255,0.7);
    --glass-strong: rgba(255,255,255,0.78);
    --border: rgba(0,0,0,0.08);
    --border-hover: rgba(207,10,44,0.35);
    --text: #181828;
    --text-dim: #606078;
    --text-faint: rgba(0,0,0,0.05);
    --shadow: 0 6px 26px rgba(0,0,0,0.08);
    --rim: rgba(255,255,255,0.65);

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(ellipse 600px 480px at 12% 8%, var(--bg-grad-1), transparent 60%),
      radial-gradient(ellipse 520px 560px at 88% 15%, var(--bg-grad-3), transparent 55%),
      radial-gradient(ellipse 680px 500px at 50% 85%, var(--bg-grad-2), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
    transition: background 0.4s ease, color 0.4s ease;
  }
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow), inset 0 1px 0 var(--rim);
    transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.28s, box-shadow 0.28s;
  }
  .glass:hover { transform: translateY(-2px); border-color: var(--border-hover); }
  .hero { text-align: center; padding: 60px 20px 30px; }
  .hero h1 { font-size: clamp(1.8rem, 6vw, 3rem); font-weight: 900; letter-spacing: 2px; margin-bottom: 8px; }
  .hero h1 .highlight { background: linear-gradient(135deg, var(--accent), #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .hero .subtitle { font-size: 0.9rem; color: var(--text-dim); }
  .theme-toggle {
    position: fixed; top: 20px; right: 20px; width: 48px; height: 48px; border-radius: 50%;
    background: var(--glass-strong); -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid var(--border); color: var(--text); font-size: 1.2rem; cursor: pointer; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.28s;
    box-shadow: var(--shadow), inset 0 1px 0 var(--rim);
  }
  .theme-toggle:hover { transform: scale(1.12) rotate(15deg); border-color: var(--accent); }
  .back-btn {
    position: fixed; top: 20px; left: 20px; height: 48px; padding: 0 20px; border-radius: 24px;
    background: var(--glass-strong); -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid var(--border); color: var(--text); font-size: 0.9rem; font-weight: 600; cursor: pointer; z-index: 200;
    display: flex; align-items: center; gap: 6px;
    transition: transform 0.3s, border-color 0.28s, color 0.28s;
    box-shadow: var(--shadow), inset 0 1px 0 var(--rim);
  }
  .back-btn:hover { transform: translateX(-3px); border-color: var(--accent); color: var(--accent); }
  .main { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 800px) { .main { grid-template-columns: 1fr; } }
  .panel { padding: 24px; }
  .panel h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 1px; }
  .form-group textarea, .form-group input[type="text"] {
    width: 100%; padding: 12px 16px; background: var(--glass-strong);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 12px; color: var(--text);
    font-size: 0.95rem; font-family: inherit; outline: none; resize: vertical;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .form-group textarea:focus, .form-group input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .form-group textarea { min-height: 100px; }
  .template-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .template-item {
    padding: 14px 10px; border-radius: 12px; border: 2px solid var(--border);
    cursor: pointer; text-align: center; font-size: 0.8rem; font-weight: 600;
    transition: all 0.25s; background: var(--glass);
  }
  .template-item:hover { transform: translateY(-2px); }
  .template-item.active { border-color: var(--accent); background: rgba(207,10,44,0.12); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
  .template-item .tpl-emoji { font-size: 1.4rem; display: block; margin-bottom: 4px; }
  .row { display: flex; gap: 12px; }
  .row .form-group { flex: 1; }
  .slider-row { display: flex; align-items: center; gap: 12px; }

  .slider-row .slider-val { font-size: 0.85rem; font-weight: 700; color: var(--accent); min-width: 40px; text-align: right; }
  .preview-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .canvas-container {
    width: 100%; max-width: 420px; aspect-ratio: 4/5; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--border); box-shadow: var(--shadow);
    position: relative;
  }
  .canvas-container canvas { width: 100%; height: 100%; display: block; }
  .export-btn {
    padding: 14px 40px; border-radius: 16px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #ff6b6b); color: #fff;
    font-size: 1rem; font-weight: 800; letter-spacing: 1px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;

  .tips { font-size: 0.78rem; color: var(--text-dim); text-align: center; margin-top: 4px; }
  @keyframes float-up {
    0% { opacity: 1; transform: translateY(0) scale(0.75); }
    15% { opacity: 1; transform: translateY(-10px) scale(1.12); }
    100% { opacity: 0; transform: translateY(-120px) scale(1.35); }

const W = 1080, H = 1350;

let currentTpl = 'redgold';
let autoNum = 1;

function wrapText(ctx, text, maxWidth) {
  const lines = [];
  const paragraphs = text.split('\n');
  for (const para of paragraphs) {
    if (para === '') { lines.push(''); continue; }
    let line = '';
    for (const char of para) {
      const test = line + char;
      if (ctx.measureText(test).width > maxWidth && line !== '') {
        lines.push(line);
        line = char;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
  }
  return lines;
}

function drawMeme() {
  const tpl = templates[currentTpl];
  const text = document.getElementById('memeText').value || '遥遥领先！';
  let num = document.getElementById('memeNum').value.trim();
  if (!num) { num = '#' + String(autoNum).padStart(3, '0'); }
  else if (!num.startsWith('#')) { num = '#' + num; }
  const sub = document.getElementById('memeSub').value.trim() || '余承东名场面';
  const fontSize = parseInt(document.getElementById('fontSize').value);
  const watermark = document.getElementById('memeWatermark').value.trim() || '余承东名场面语录';

  ctx.clearRect(0, 0, W, H);
  tpl.bg(ctx);

  ctx.save();
  ctx.strokeStyle = tpl.border;
  ctx.lineWidth = 4;
  ctx.strokeRect(30, 30, W - 60, H - 60);
  ctx.strokeStyle = tpl.lineColor;
  ctx.lineWidth = 1;
  ctx.strokeRect(44, 44, W - 88, H - 88);
  ctx.restore();

  ctx.save();
  ctx.font = `900 ${fontSize * 2.2}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.fillStyle = tpl.numColor;
  ctx.textAlign = 'left';
  ctx.fillText(num, 80, 180);
  ctx.restore();

  ctx.save();
  ctx.font = `600 36px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.fillStyle = tpl.subColor;
  ctx.textAlign = 'right';
  ctx.fillText(sub, W - 80, 160);
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = tpl.lineColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(80, 220);
  ctx.lineTo(W - 80, 220);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.font = `900 ${fontSize}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.fillStyle = tpl.textColor;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const maxWidth = W - 200;
  const lines = wrapText(ctx, text, maxWidth);
  const lineHeight = fontSize * 1.4;
  const totalHeight = lines.length * lineHeight;
  const startY = H / 2 - totalHeight / 2 + lineHeight / 2;
  lines.forEach((line, i) => {
    ctx.fillText(line, W / 2, startY + i * lineHeight);
  });
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = tpl.lineColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(80, H - 180);
  ctx.lineTo(W - 80, H - 180);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.font = `500 32px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.fillStyle = tpl.waterColor;
  ctx.textAlign = 'center';
  ctx.fillText(watermark, W / 2, H - 120);
  ctx.font = `400 24px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
  ctx.fillText('daijincy.github.io/--Yu-Chengdong-Quotes', W / 2, H - 80);
  ctx.restore();
}

document.getElementById('memeText').addEventListener('input', drawMeme);
document.getElementById('memeNum').addEventListener('input', drawMeme);
document.getElementById('memeSub').addEventListener('input', drawMeme);
document.getElementById('memeWatermark').addEventListener('input', drawMeme);
document.getElementById('fontSize').addEventListener('input', (e) => {
  document.getElementById('fontSizeVal').textContent = e.target.value;
  drawMeme();
});

document.getElementById('templateGrid').addEventListener('click', (e) => {
  const item = e.target.closest('.template-item');
  if (!item) return;
  document.querySelectorAll('.template-item').forEach(t => t.classList.remove('active'));
  item.classList.add('active');
  currentTpl = item.dataset.tpl;
  spawnFloatText(e.clientX, e.clientY, 1);
  drawMeme();
});

document.getElementById('exportBtn').addEventListener('click', (e) => {
  spawnFloatText(e.clientX, e.clientY, 2);
  const link = document.createElement('a');
  const num = document.getElementById('memeNum').value.trim() || ('#' + String(autoNum).padStart(3, '0'));
  link.download = `余式梗图_${num.replace('#','')}_${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  autoNum++;
});

const themeToggle = document.getElementById('themeToggle');
const themes = ['auto', 'dark', 'light'];
const themeIcons = { auto: '🔮', dark: '🌙', light: '☀️' };
let currentThemeIdx = 0;
function applyTheme(theme) {
  if (theme === 'auto') {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.body.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  } else {
    document.body.setAttribute('data-theme', theme);
  }
  themeToggle.textContent = themeIcons[theme];
  try { localStorage.setItem('ycd-theme', theme); } catch(e) {}
}
let savedTheme = 'auto';
try { savedTheme = localStorage.getItem('ycd-theme') || 'auto'; } catch(e) {}
currentThemeIdx = themes.indexOf(savedTheme);
if (currentThemeIdx < 0) currentThemeIdx = 0;
applyTheme(themes[currentThemeIdx]);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (themes[currentThemeIdx] === 'auto') applyTheme('auto');
});
themeToggle.addEventListener('click', (e) => {
  currentThemeIdx = (currentThemeIdx + 1) % themes.length;
  applyTheme(themes[currentThemeIdx]);
  spawnFloatText(e.clientX, e.clientY, 1);
});

document.querySelector('.back-btn').addEventListener('click', (e) => {
  spawnFloatText(e.clientX, e.clientY, 1);
});

drawMeme();
</script>
</body>
</html>
